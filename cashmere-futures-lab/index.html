<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Cashmere Futures Lab | Development Access</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f7f3ef;color:#3b1f24;font-family:Georgia,'Times New Roman',serif}.gate{width:min(520px,90%);padding:48px 42px;background:#fff;border:1px solid #e4ddd8;box-shadow:0 18px 55px rgba(50,25,25,.10);text-align:center}.mark{font-family:Arial,sans-serif;font-size:30px;font-weight:700;letter-spacing:.16em;margin-bottom:22px}.eyebrow{font:600 11px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;margin:0 0 14px}.gate h1{font-size:32px;font-weight:500;line-height:1.15;margin:0 0 16px}.gate p{font-size:16px;line-height:1.65;color:#66585a;margin:0 auto 28px;max-width:420px}.form{display:flex;gap:9px;justify-content:center}.form input{flex:1;min-width:0;padding:13px 14px;border:1px solid #cfc4c1;font:15px Arial,sans-serif}.form button{padding:13px 20px;border:0;background:#5a1f2b;color:#fff;font:600 13px Arial,sans-serif;letter-spacing:.05em;cursor:pointer}.error{min-height:22px;margin:12px 0 0;color:#8a2d2d;font:13px Arial,sans-serif}.note{margin-top:26px!important;font-size:13px!important;color:#887b7c!important}
  </style>
</head>
<body>
  <main class="gate" aria-labelledby="title">
    <div class="mark">CFL</div>
    <p class="eyebrow">Cashmere Futures Lab</p>
    <h1 id="title">Development Preview</h1>
    <p>This website is currently under development. Access is restricted while the Lab is being prepared.</p>
    <form class="form" id="accessForm">
      <input id="key" type="password" autocomplete="off" placeholder="Enter access key" aria-label="Access key" required>
      <button type="submit">ENTER</button>
    </form>
    <div class="error" id="error" role="alert"></div>
    <p class="note">To request access, please contact Imran Ishrat.</p>
  </main>
  <script>
    /* Temporary development gate only. This is not security-grade authentication. */
    const ACCESS_HASH = '8c9f7c5b4c2b4e6b6b9e5d5c0b0d4e6f7b5f1a2c3d4e5f60718293a4b5c6d7e8';
    async function hash(value){
      const data = new TextEncoder().encode(value);
      const digest = await crypto.subtle.digest('SHA-256', data);
      return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
    document.getElementById('accessForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const key=document.getElementById('key').value;
      const error=document.getElementById('error');
      error.textContent='';
      if(await hash(key)===ACCESS_HASH){
        sessionStorage.setItem('cflPreviewAccess','granted');
        window.location.href='lab.html';
      }else{
        error.textContent='Access key not recognised.';
      }
    });
    if(sessionStorage.getItem('cflPreviewAccess')==='granted') window.location.href='lab.html';
  </script>
</body>
</html>
